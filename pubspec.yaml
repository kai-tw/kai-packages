# Workspace root. Not a package — it exists so `dart pub get` resolves every
# member against one shared lockfile, which is the whole point of keeping these
# in one repo: two packages can never disagree about a dependency version.
name: _
publish_to: none

environment:
  sdk: ^3.8.0

workspace:
  - packages/clock_anchor
  - packages/connectivity_status
  - packages/dart_lints
  - packages/dart_mutants
  - packages/design_mockups
  - packages/design_mockups_annotations
  - packages/hybrid_logical_clock
  - packages/image_codec
  - packages/log_system
  - packages/preference_store
  - packages/ui_kit
  - packages/versioned_json

# Lets `dart run dart_lints` and `dart run dart_mutants` work from the repo
# root, so both commands are the same here as in a consuming app.
dev_dependencies:
  dart_lints:
    path: packages/dart_lints
  dart_mutants:
    path: packages/dart_mutants
