# Workspace root. Not a package — it exists so `dart pub get` resolves every
# member against one shared lockfile, which is the whole point of keeping these
# in one repo: two packages can never disagree about a dependency version.
name: _
publish_to: none

environment:
  sdk: ^3.8.0

workspace:
  - packages/clock_anchor
  - packages/connectivity_status
  - packages/dart_lints
  - packages/dart_mutants
  - packages/design_mockups
  - packages/design_mockups_annotations
  - packages/hybrid_logical_clock
  - packages/image_codec
  - packages/log_system
  - packages/preference_store
  - packages/ui_kit

# Lets `dart run dart_lints` work from the repo root, so the lint entry point is
# the same here as in a consuming app.
#
# `dart_mutants` is here for the same reason and one extra one: `plan-mutation`
# resolves the git toplevel and `cd`s to it before doing anything, so the only
# pubspec it ever reads is this one. Declared solely in a member package — as
# `image_codec` and `log_system` do, for invoking the engine from inside their
# own directory — the gate reports "this project does not depend on
# dart_mutants" and measures nothing, which reads as a missing tool rather than
# as a lookup happening one directory up.
dev_dependencies:
  dart_lints:
    path: packages/dart_lints
  dart_mutants:
    path: packages/dart_mutants
