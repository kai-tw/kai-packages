name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter SDK, not bare Dart: ui_kit depends on `flutter: sdk:
      # flutter`, which plain dart-lang/setup-dart can't resolve. No
      # flutter-version pin — subosito/flutter-action has no literal
      # "latest" value; omitting the field and keeping channel: stable is
      # its documented way to always resolve the newest stable release.
      # Every package's SDK constraint here is a caret lower bound
      # (`^3.8.0`, `^3.12.0`), so a newer bundled Dart always satisfies it —
      # the tradeoff is losing exact reproducibility between CI runs in
      # exchange for never going stale.
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # One resolution for the whole workspace, from the root.
      - run: flutter pub get

      - run: dart format --output=none --set-exit-if-changed .

      # One entry point, so the stock analyzer and the custom rules cannot
      # disagree about scope. dart_lints runs `dart analyze --fatal-infos`
      # itself — the flags live in dart_lints.yaml, where dropping one is a
      # visible diff rather than a silent weakening (linter diagnostics are
      # INFO severity, so without it the 71 rules in analysis_options.yaml
      # print and the command still exits 0).
      - run: dart run dart_lints

      - run: dart test
        working-directory: packages/dart_lints

      # Added after dart_lints on purpose — dart_mutants is declared in the
      # same place for the same reason (see pubspec.yaml's dev_dependencies
      # comment) and, like clock_anchor before it, had no step of its own
      # here, so its suite silently never ran in CI. That suite drives real
      # subprocesses (dart pub get, dart analyze, dart test, SIGTERM/SIGKILL)
      # rather than mocking any of them, so it is the slowest package step in
      # this job — and its own dart_test.yaml pins concurrency: 1 and a 4x
      # timeout on top of that, because each of those subprocess runs is now
      # a cold compile by design (see TestCompilationCache). That is the
      # accepted trade, not a flake to chase.
      - run: dart test
        working-directory: packages/dart_mutants

      - run: dart test
        working-directory: packages/hybrid_logical_clock

      # Runs after hybrid_logical_clock's own suite on purpose: clock_anchor
      # carries an integration test against the real package rather than a
      # stand-in, so when both break, the narrower failure is the one to read
      # first.
      #
      # Every package's tests are listed by hand here, which means a package
      # added without a step of its own is silently never tested. That is how
      # this one nearly shipped.
      - run: dart test
        working-directory: packages/clock_anchor

      - run: dart test
        working-directory: packages/versioned_json

      # `flutter test`, not `dart test`: ui_kit's tests import `flutter_test`,
      # which the bare Dart test runner cannot load.
      - run: flutter test
        working-directory: packages/ui_kit

      - run: flutter test
        working-directory: packages/connectivity_status

      - run: flutter test
        working-directory: packages/preference_store

      - run: flutter test
        working-directory: packages/log_system

      # connectivity_status's example app is not in the pub workspace (a
      # federated plugin's example never is), so it needs its own
      # resolution before it can build.
      - run: flutter pub get
        working-directory: packages/connectivity_status/example

      # Validates the Android half of the metered-probe plugin actually
      # compiles and links — Dart unit tests mock ConnectivityMeteredDataSource,
      # so they never touch the real native code. Runs on ubuntu because the
      # Android SDK this needs ships on GitHub's runner already; the iOS half
      # needs a real Xcode toolchain, so it gets its own macOS job below.
      - run: flutter build apk --debug
        working-directory: packages/connectivity_status/example

      # Catches pub.dev's own complaints (missing example, bad description
      # length, unresolvable doc links) before a release rather than during one.
      - run: dart pub publish --dry-run
        working-directory: packages/hybrid_logical_clock

      - run: dart pub publish --dry-run
        working-directory: packages/clock_anchor

      # ui_kit, connectivity_status and versioned_json are intentionally not
      # published (git dependency only), so no publish dry-run step for them.

  connectivity_status_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: flutter pub get
        working-directory: packages/connectivity_status/example

      # The one native-code package in this repo, and the one reason this
      # workflow needs a macOS runner at all: the metered-probe plugin's iOS
      # side (Swift, a podspec, a Swift Package Manager manifest) can only be
      # compiled with a real Xcode toolchain, which ubuntu-latest does not
      # have. --no-codesign because CI has no signing identity and does not
      # need one to prove the native code builds and links.
      - run: flutter build ios --no-codesign --debug
        working-directory: packages/connectivity_status/example
