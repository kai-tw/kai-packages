name: log_system
description: Structured logging with a redacted crash-reporting egress, shared across my Flutter projects.
version: 0.4.1
repository: https://github.com/kai-tw/kai-packages/tree/main/packages/log_system

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  firebase_core: ^4.0.0
  firebase_crashlytics: ^5.0.5
  flutter:
    sdk: flutter
  logger: ^2.6.2

dev_dependencies:
  # A workspace path dependency, not a git tag: inside this repo the tool
  # under test IS the working tree. Consuming apps pin `dart_mutants` by tag
  # instead, because for them it is a released tool rather than a sibling.
  dart_mutants:
    path: ../dart_mutants
  # `setupFirebaseCoreMocks()`, for the one test that resolves the real
  # `FirebaseCrashlytics.instance` (real_crashlytics_client_test.dart).
  firebase_core_platform_interface: ^8.1.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Scoped to one file: firebase_crashlytics_client_test.dart's
  # `_MockFirebaseCrashlytics extends Mock implements FirebaseCrashlytics`.
  # `FirebaseCrashlytics` has a private constructor, so a hand-written fake
  # cannot `extends` it; `Mock`'s `implements` + `noSuchMethod` sidesteps the
  # constructor entirely, which is the one thing a hand-written fake cannot.
  # Every other test in this package — including the crash-reporter adapter
  # itself — uses a hand-written fake against a contract this package owns;
  # see `FirebaseCrashlyticsClient`'s doc comment for why this one file is
  # different.
  mocktail: ^1.0.4
