name: test_toolkit
description: >-
  Keeps `flutter test` from using more memory than the machine has, or
  filling its disk: called from flutter_test_config.dart, it caps each test
  process's memory and disk writes and makes every test process on the
  machine take a turn from one shared set of slots.
version: 0.2.0
publish_to: none
repository: https://github.com/kai-tw/kai-packages/tree/main/packages/test_toolkit
issue_tracker: https://github.com/kai-tw/kai-packages/issues

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  path: ^1.9.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
