name: dart_mutants
description: >-
  AST-based mutation testing for Dart and Flutter. Asks both whether an
  expression's branch is pinned (ternary, switch arms, null-coalescing,
  comparisons) and whether a line's effect is asserted at all (statement
  deletion, condition negation), by walking the same analyzer AST dart_lints
  already does rather than pattern-matching source text.
version: 0.6.1
repository: https://github.com/kai-tw/kai-packages/tree/main/packages/dart_mutants

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  analyzer: ">=9.0.0 <11.0.0"
  args: ^2.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  path: ^1.9.0

dev_dependencies:
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  lints: ^6.1.0
  test: ^1.25.0
