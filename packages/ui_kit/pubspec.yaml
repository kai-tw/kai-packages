name: ui_kit
description: This is a UI kit that shares Flutter components through my projects.
version: 4.1.0
repository: https://github.com/kai-tw/kai-packages/tree/main/packages/ui_kit

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  loading_animation_widget: ^1.2.0+4
  package_info_plus: ^9.0.0

dev_dependencies:
  # A workspace path dependency, not a git tag: inside this repo the engine
  # under test IS the working tree. Consuming apps pin `dart_mutants` by tag
  # instead, because for them it is a released tool rather than a sibling.
  dart_mutants:
    path: ../dart_mutants
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
