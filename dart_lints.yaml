# Lint configuration for this workspace. Read by `dart run dart_lints`, which
# runs the stock analyzer and the custom rules over the same paths so there is
# one entry point rather than two that can disagree about scope.

analyzer:
  command: dart
  # --fatal-infos is load-bearing, not decoration: linter diagnostics are INFO
  # severity, so without it the 71 rules in analysis_options.yaml print and the
  # command still exits 0.
  args: [--fatal-infos]

exclude:
  - "**/*.freezed.dart"
  - "**/*.g.dart"
  # Flutter/Xcode/Gradle build output — populated by actually building a
  # package locally (a federated plugin's example app, say), never
  # version-controlled. Without this, a local `flutter build ios` can litter
  # the tree with vendored third-party SPM package sources under `build/`,
  # which then get analyzed as if they were this repo's own code.
  - "**/build/**"

# Every Dart file must belong to an area or be listed here; anything else is a
# configuration error rather than a region that silently goes unlinted.
coverageIgnore: []

# No bloc or getit: nothing here uses either, and enabling a bundle whose types
# a codebase never mentions buys nothing but a slower run.
bundles: [core, flutter]

areas:
  # Declared BEFORE `production` on purpose: a file matching more than one area
  # belongs to the FIRST one declared, so this narrow entry has to win the
  # overlap with `packages/*/lib/**` below.
  #
  # ONE file, and it must stay one file. The exemption is exactly as wide as
  # this glob, so moving an engine call into a second file would silently widen
  # a lint exemption rather than reorganise code.
  #
  # Why it cannot be satisfied instead of exempted: every `dart:ui` native call
  # routes failure through one generic bridge (`_futurize` in the engine's
  # `painting.dart`) that hardcodes `throw Exception('operation failed')`.
  # There is no narrower type in existence to catch, and no predicate to ask
  # beforehand — the condition cannot be detected without attempting it. The
  # rule's premise ("a narrower type exists") is false at this boundary and
  # only at this boundary.
  #
  # `avoid_catching_object` and `avoid_catching_error` are deliberately NOT
  # disabled here. The one Error-side failure this package handles
  # (`CompressError`, from flutter_image_compress) is caught by name, which the
  # error rule already permits — it matches a fixed list of `dart:core` types.
  image_codec_engine_boundary:
    paths:
      - "packages/image_codec/lib/src/engine_image_boundary.dart"
    disable:
      - avoid_catching_base_exception
  # Declared before `test` below, for the same first-match reason.
  #
  # ONE file, and it must stay one file. This test proves that a headless
  # render produces real glyphs rather than the filled rectangles `flutter
  # test` substitutes when no font is loaded, and it proves it by counting dark
  # pixels against a light ground. The two colours are therefore the
  # MEASUREMENT INSTRUMENT, not presentation: a `colorScheme` pairing is chosen
  # for comfortable reading, which narrows exactly the gap being measured and
  # turns a categorical check ("~100% ink means boxes") into a threshold to be
  # re-tuned per theme. The rule's premise — that a colour here is a design
  # decision a token should own — is false for this file and only for this one.
  #
  # First-match-wins also means this area REPLACES `test` for this file rather
  # than adding to it, so `test`'s own disables are repeated below. Without
  # them the one file with an exemption would silently be held to a *stricter*
  # bar than every other test in the repo — the opposite of what the entry is
  # for. Keep the two lists in step.
  design_mockups_ink_measurement:
    paths:
      - "packages/design_mockups/test/no_tofu_test.dart"
    disable:
      - avoid_hardcoded_color
      - avoid_record_types
      - avoid_empty_catch
      - avoid_catching_base_exception
  production:
    paths:
      - "packages/*/lib/**"
      - "packages/*/bin/**"
      # A plugin's bundled example app is real, working code — a consumer
      # reads it as the worked example of how to use the package, so it is
      # held to the same bar as the package itself rather than exempted.
      - "packages/*/example/lib/**"
  test:
    paths:
      - "packages/*/test/**"
      - "packages/*/example/test/**"
      - "packages/*/example/integration_test/**"
    disable:
      # Test-local decision tables and capture tuples are not DTOs.
      - avoid_record_types
      # Swallowing an engine exception and asserting via a verify() call is the
      # real assertion; the empty arm is deliberate.
      - avoid_empty_catch
      - avoid_catching_base_exception

options:
  avoid_high_cyclomatic_complexity:
    # Kai's call, made 2026-08-30. 21 existing functions currently exceed
    # this — that's deliberate, not an oversight: the point of landing the
    # rule now is to stop new ones joining that list, not to force a
    # cleanup pass of the existing 21 in the same change. Fixing any of
    # them is separate, later work.
    maxComplexity: 8
  failure_type_naming:
    # dart_lints names each rule class after the rule it implements:
    # `avoid_catching_error` is `AvoidCatchingError`. The last word there is the
    # subject of the rule, not the kind of the class, so the rule classes are
    # named by that scheme instead.
    exemptSubtypesOf: [LintRule, ResolvedLintRule, ProjectLintRule]
  avoid_top_level_identifiers:
    # These packages are published libraries: their top-level declarations are
    # the public API, not stray globals. The rule's premise does not hold here.
    scope: library
  public_class_names_its_file:
    exemptFiles:
      # Flutter's own convention: an app's entry point is always main.dart,
      # and nothing requires its root widget's name to match. Every Flutter
      # app in existence has this "mismatch" — it isn't a defect to flag.
      - main.dart
      # A federated plugin's platform-interface pair, in the exact shape
      # `flutter create --template=plugin` generates:
      # `<pkg>_platform_interface.dart` declares `<Pkg>Platform`,
      # `<pkg>_method_channel.dart` declares `MethodChannel<Pkg>`. Neither
      # name is ever going to match its filename, for any federated plugin
      # this repo ever adds — the mismatch is the convention, not a typo.
      - _platform_interface.dart
      - _method_channel.dart
      # dart_lints's own rule-authoring SDK: SourceEdit, LintFix,
      # LintViolation, LintRule, LintVisitor, ResolvedLintRule, ProjectUnit,
      # ProjectLintRule, ResolvedLintVisitor. None is a prefix or subtype of
      # another, so the rule's existing "companion type has an owner"
      # exemptions do not apply — but splitting nine tightly-coupled base
      # types (a rule's return value, its violation model, its two visitor
      # shapes) into nine files would scatter one vocabulary a rule author
      # reads together, not fix a name that drifted from its file.
      - lint_rule_base.dart
